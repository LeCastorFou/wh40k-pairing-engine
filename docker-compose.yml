services:
  pairing:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      TEAM_NAME: ${TEAM_NAME:-Pairing Engine}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-embukey}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      DATA_DIR: /app/data
    volumes:
      - /srv/test/${TEAM_SLUG:-embuscade}:/app/data
    restart: unless-stopped
