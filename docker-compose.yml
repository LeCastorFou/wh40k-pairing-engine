services:
  pairing:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      TEAM_NAME: ${TEAM_NAME:-Pairing Engine}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-valent1lefranc@gmail.com}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set SUPABASE_DB_URL}
      DATA_DIR: /app/data
    restart: unless-stopped
