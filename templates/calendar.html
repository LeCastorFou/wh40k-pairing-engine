<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Calendar - 40K Pairing</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

    * { box-sizing: border-box; }

    :root {
      --bg: #07070b;
      --panel: rgba(13, 14, 20, 0.92);
      --panel-2: rgba(18, 18, 26, 0.95);
      --text: #f2f2f4;
      --muted: #a6a6b0;
      --accent: #ff6b3d;
      --accent-2: #ffa25d;
      --line: rgba(255,255,255,0.08);
      --availability: #4db6ac;
      --pairing: #ba68c8;
      --game: #ffd166;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,107,61,0.18), transparent 45%),
        radial-gradient(circle at 80% 15%, rgba(255,210,102,0.12), transparent 50%),
        linear-gradient(180deg, #050508 0%, #0a0a12 60%, #050507 100%);
      color: var(--text);
    }

    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .page {
      max-width: 1320px;
      margin: 0 auto;
      padding: 2rem clamp(1.2rem, 4vw, 3rem) 3rem;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .title-block h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 1.8rem;
    }

    .title-block p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .back-link {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.33fr);
      gap: 1.5rem;
    }

    .panel {
      position: relative;
      padding: 1.4rem 1.6rem;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -40% 30% auto -30%;
      height: 220px;
      background: radial-gradient(circle, rgba(255,107,61,0.16), transparent 65%);
      pointer-events: none;
    }

    .panel h2 {
      margin: 0 0 0.75rem;
      font-size: 0.9rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 0.35rem;
    }

    select, input, textarea {
      width: 100%;
      background: rgba(7,7,10,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: var(--text);
      padding: 0.55rem 0.7rem;
      font-size: 0.9rem;
      outline: none;
    }

    textarea { min-height: 70px; resize: vertical; }

    .btn {
      background: linear-gradient(135deg, #ff6b3d, #b83f1d);
      border: none;
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255,107,61,0.2);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--text);
      box-shadow: none;
    }

    .legend {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .legend b {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 0.4rem;
      font-size: 0.85rem;
    }

    .toggle-row label {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .calendar-panel {
      padding: 1.2rem;
      background: var(--panel-2);
    }

    #fc-calendar {
      margin-top: 1rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(5,5,8,0.92);
      padding: 0.6rem;
    }

    .fc {
      color: var(--text);
      font-size: 0.85rem;
    }

    .fc .fc-toolbar-title {
      font-family: 'Playfair Display', serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 1.05rem;
      color: var(--text);
    }

    .fc .fc-button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.68rem;
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
    }

    .fc .fc-button-primary:not(:disabled).fc-button-active,
    .fc .fc-button-primary:not(:disabled):active {
      background: linear-gradient(135deg, #ff6b3d, #b83f1d);
      border-color: transparent;
    }

    .fc .fc-button:focus {
      box-shadow: none;
    }

    .fc .fc-col-header-cell-cushion,
    .fc .fc-daygrid-day-number {
      color: var(--muted);
    }

    .fc-theme-standard .fc-scrollgrid,
    .fc-theme-standard td,
    .fc-theme-standard th {
      border-color: rgba(255,255,255,0.08);
    }

    .fc .fc-timegrid-slot {
      height: 1.8em;
    }

    .fc .fc-event {
      border-radius: 8px;
      border: none;
      padding: 0.15rem 0.25rem;
      font-size: 0.72rem;
    }

    .status {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top-bar">
      <div class="title-block">
        <h1>Team Availability Calendar</h1>
        <p>{{ team_name }} · Multi-View</p>
      </div>
      <a class="back-link" href="{{ url_for('index') }}">Back to Command</a>
    </div>

    <div class="layout">
      <div>
        <div class="panel calendar-panel">
          <h2>Calendar Views</h2>
          <div class="legend">
            <span><b style="background: var(--availability);"></b>Availability (player color)</span>
            <span><b style="background: var(--pairing);"></b>Pairing Session</span>
            <span><b style="background: var(--game);"></b>Planned Match</span>
          </div>
          <div class="toggle-row">
            <label><input type="checkbox" id="filter-availability" checked> Availability</label>
            <label><input type="checkbox" id="filter-pairing" checked> Pairings</label>
            <label><input type="checkbox" id="filter-game" checked> Games</label>
          </div>
          <div id="fc-calendar"></div>
          <div class="status" id="calendar-status"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Book a Slot</h2>
        <div class="status" style="margin-top:-0.2rem;">Suggested play window: 12:00–00:00.</div>
        <div class="control-grid">
          <div>
            <label for="slot-type">Type</label>
            <select id="slot-type">
              <option value="availability">Availability</option>
              <option value="pairing">Pairing Session</option>
              <option value="game">Game Slot</option>
            </select>
          </div>
          <div>
            <label for="slot-player">Player</label>
            <select id="slot-player"></select>
          </div>
          <div>
            <label for="slot-game">Saved Game</label>
            <select id="slot-game"></select>
          </div>
          <div>
            <label for="slot-date">Date</label>
            <input type="date" id="slot-date">
          </div>
          <div>
            <label for="slot-start">Start</label>
            <input type="time" id="slot-start" step="1800">
          </div>
          <div>
            <label for="slot-end">End</label>
            <input type="time" id="slot-end" step="1800">
          </div>
        </div>
        <div style="margin-bottom:0.9rem;">
          <label for="slot-title">Title</label>
          <input type="text" id="slot-title" placeholder="Optional custom label">
        </div>
        <div style="margin-bottom:0.9rem;">
          <label for="slot-notes">Notes</label>
          <textarea id="slot-notes" placeholder="Venue, mission, or logistics"></textarea>
        </div>
        <button class="btn" id="slot-save">Save Slot</button>
        <button class="btn secondary" id="slot-clear" style="margin-left:0.6rem;">Clear</button>
        <div class="status" id="form-status"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
  <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>
</html>
